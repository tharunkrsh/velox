id: ftmo-1step-bestday
name: FTMO Challenge 1-Step (legacy Best Day Rule, orders before 2026-10-12)
version: "2026-11"
source_urls:
  - https://ftmo.com/en/1-step-challenge/
  - https://ftmo.com/au/trading-objectives/#1-step-best-day-rule
  - https://ftmo.com/en/blog/trading-updates/trading-update-8-oct-2026/
verified_at: 2026-11-26
needs_verification:
  - "Whether the EOD trailing Max Loss stops trailing at some level is not stated; modelled as
    never locking."
  - "Minimum trading days for 1-Step not confirmed; none modelled."
notes:
